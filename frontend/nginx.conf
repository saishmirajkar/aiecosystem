# Serves the SPA and proxies /api to the backend.
# Terminate TLS in front of this container (load balancer / reverse proxy) or add a TLS server block.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;
  server_tokens off;

  # Security headers live in a snippet because an add_header inside a location
  # replaces (does not extend) the server-level ones.
  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;  # AI requests can run longer than ordinary API calls
  }

  location /assets/ {
    expires 1y;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
